server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Vite gives every bundle a content hash in its filename, so a given URL
    # under /assets/ never changes what it returns. Cache it hard.
    location /assets/ {
        # nginx add_header does not inherit: a location that adds any header
        # discards every add_header from the server block. The security
        # headers are repeated here for that reason, not by accident.
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Cache-Control "public, max-age=31536000, immutable";

        try_files $uri =404;
    }

    location / {
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # index.html is the only file that names which hashed bundle to load.
        # Served without cache directives it gets heuristically cached by the
        # browser, which then keeps loading the *previous* deploy's bundle —
        # the new files are on the server and nobody sees them until they hard
        # refresh. "no-cache" means revalidate before use, not "never store",
        # so this stays cheap: a 304 on every load.
        add_header Cache-Control "no-cache";

        try_files $uri $uri/ /index.html;
    }
}
