services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - PDFSIGN_LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - PDFSIGN_LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - PDFSIGN_CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:80"]}
      - PDFSIGN_API_SECRET_KEY=${API_SECRET_KEY:-}
      - PDFSIGN_STORAGE_ROOT=/data/tmp
      - PDFSIGN_DB_PATH=/data/applications.db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  app_data:
