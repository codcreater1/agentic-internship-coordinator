name: Daily Profile Update

on:
  schedule:
    - cron: '47 10 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Update profile README
        env:
          GH_TOKEN: ${{ secrets.PROFILE_PAT }}
        run: |
          DATE=$(date +%Y-%m-%d)

          RESPONSE=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/codcreater1/Murat-Can-Nergiz/contents/README.md")

          SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          CONTENT=$(echo "$RESPONSE" | python3 -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode())")

          UPDATED=$(echo "$CONTENT" | grep -v "<!-- last-active:")
          UPDATED="$UPDATED"$'\n'"<!-- last-active: $DATE -->"

          ENCODED=$(echo "$UPDATED" | base64 -w 0)

          BODY=$(python3 -c "import json; print(json.dumps({'message': 'chore: daily activity update [$DATE]', 'content': '$ENCODED', 'sha': '$SHA'}))")

          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/codcreater1/Murat-Can-Nergiz/contents/README.md"

          echo "Done: $DATE"
